# Clase 36 - Ejercicio integrador: plataforma de votación en alta disponibilidad
#   Usuario -> lb (Nginx, puerto 8088) -> nodo1 / nodo2 / nodo3 (red privada clusternet)
name: votacion

# Configuración común de los 3 nodos (ancla YAML: se reutiliza con <<: *nodo)
x-nodo: &nodo
  build: ./app
  image: votacion-app
  restart: unless-stopped
  volumes:
    - votos:/app/data            # los 3 nodos comparten los votos
  networks: [clusternet]
  # Sin "ports": los nodos NO se publican hacia afuera, solo el balanceador.
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9090/health"]
    interval: 5s
    timeout: 3s
    retries: 2
    start_period: 5s

services:
  nodo1:
    <<: *nodo
    hostname: nodo1
    environment:
      NODO: nodo1

  nodo2:
    <<: *nodo
    hostname: nodo2
    environment:
      NODO: nodo2

  nodo3:
    <<: *nodo
    hostname: nodo3
    environment:
      NODO: nodo3

  lb:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ["8088:80"]           # único puerto abierto hacia afuera
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [clusternet]
    depends_on:
      nodo1: { condition: service_healthy }
      nodo2: { condition: service_healthy }
      nodo3: { condition: service_healthy }

networks:
  clusternet:

volumes:
  votos:
