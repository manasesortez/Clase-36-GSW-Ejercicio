# Balanceador de carga del clúster de votación (Clase 35 + correcciones probadas)

# DNS interno de Docker: permite que Nginx arranque aunque un nodo esté apagado
# y que vuelva a encontrarlo cuando se enciende (parámetro "resolve", Nginx >= 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream votacion_cluster {
    # Memoria compartida: todos los workers de Nginx comparten el turno del Round Robin.
    zone votacion_cluster 64k;

    server nodo1:9090 resolve max_fails=2 fail_timeout=10s;
    server nodo2:9090 resolve max_fails=2 fail_timeout=10s;
    server nodo3:9090 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    # Muestra en la respuesta a qué nodo (IP:puerto) se envió la petición.
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://votacion_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si un nodo no acepta la conexión en 2 s, se da por caído (por defecto: 60 s).
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Si el nodo elegido falla, reintentar en otro antes de responder al usuario.
        # Los POST (votos) solo se reintentan si no llegaron al nodo: no hay votos dobles.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
